
name: App Deployment

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Run ID of the Terraform Plan workflow"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Get source commit from Terraform Plan run
        id: plan_source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        shell: bash
        run: |
          if [[ ! "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid plan run ID."
            exit 1
          fi

          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}" --jq '.head_sha')

          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout application repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan_source.outputs.commit_sha }}

      - name: Download reviewed Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.plan_run_id }}
          path: plan-artifact
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout private state repository
        uses: actions/checkout@v7
        with:
          repository: swobenator/Terraform_State
          token: ${{ secrets.STATE_REPO_TOKEN }}
          path: state-repo

      - name: Restore Terraform state
        id: restore
        shell: bash
        run: |
          if [ ! -f state-repo/terraform.tfstate ]; then
            echo "::error::Terraform state is missing."
            exit 1
          fi

          cp state-repo/terraform.tfstate ./terraform.tfstate
          echo "state_found=true" >> "$GITHUB_OUTPUT"

          mv plan-artifact/tfplan ./tfplan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -input=false

      - name: Apply Reviewed Terraform Plan
        run: terraform apply -input=false -no-color tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Save Terraform state to private repository
        if: always() && steps.restore.outputs.state_found == 'true' && hashFiles('terraform.tfstate') != ''
        shell: bash
        run: |
          cp terraform.tfstate state-repo/terraform.tfstate

          git -C state-repo config user.name "github-actions[bot]"
          git -C state-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C state-repo add terraform.tfstate

          if ! git -C state-repo diff --cached --quiet; then
            git -C state-repo commit -m "Update Terraform state [skip ci]"
            git -C state-repo push
          else
            echo "Terraform state has not changed."
          fi
