
name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform-plan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7

      - name: Checkout private state repository
        uses: actions/checkout@v7
        with:
          repository: swobenator/Terraform_State
          token: ${{ secrets.STATE_REPO_TOKEN }}
          path: state-repo

      - name: Restore Terraform state
        shell: bash
        run: |
          if [ ! -f state-repo/terraform.tfstate ]; then
            echo "::error::Terraform state is missing."
            exit 1
          fi

          cp state-repo/terraform.tfstate ./terraform.tfstate

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Display Terraform Plan
        run: terraform show -no-color tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: tfplan
          retention-days: 1
          if-no-files-found: error
